# Port number. The client has the authserver port hardcoded to 1001
auth_server_port=1001

# 0 or 1, should ignore playkeys
# If 1 everyone with an account will be able to login, regardless of if they have a key or not
dont_use_keys=0

# list of rewardcodes to set on the accounts by default
# ex: 30,1,0,3
# See RewardCodes in the CDclient for what codes exist
# Default 4,30
# 4 allows LEGOClub access
# 30 makes the client not consume bricks when in bbb mode
rewardcodes=4,30

# ---- Logging in ----
# Staff only: Only accounts with a GM level can log in.
closed_to_non_devs=0
# Remember login addresses: Keep the network address each account logs in to the game from, so staff see accounts that
# share one. Addresses are personal data: they're only shown as links between accounts, and deleted after
# log_login_address_days.
log_login_addresses=1
# Remember client system info: Keep the system description the client sends when it logs in (Windows version, video
# card, processor count, memory), as the client reported it, for staff with client_sysinfo. The client's old Windows calls
# often report compatibility values, not the real hardware. Deleted after log_client_sysinfo_days.
log_client_sysinfo=1
